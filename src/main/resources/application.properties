spring.application.name=cursillo-api-gateway
server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# cursillo-ms-inscripciones
spring.cloud.gateway.server.webmvc.routes[0].id=inscripciones
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://cursillo-ms-inscripciones
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/inscripciones/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

