spring.application.name=cursillo-api-gateway
server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# cursillo-ms-inscripciones
spring.cloud.gateway.server.webmvc.routes[0].id=inscripciones
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://cursillo-ms-inscripciones
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/inscripciones/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# cursillo-ms-notas
# notas
spring.cloud.gateway.server.webmvc.routes[1].id=notas
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://cursillo-ms-notas
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/notas/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# examenes
spring.cloud.gateway.server.webmvc.routes[3].id=examenes
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://cursillo-ms-notas
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/examenes/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

# materias
spring.cloud.gateway.server.webmvc.routes[4].id=materias
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://cursillo-ms-notas
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/materias/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

# cursillo-ms-facturas
# facturas
spring.cloud.gateway.server.webmvc.routes[2].id=facturas
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://cursillo-ms-facturas
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/facturas/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# conceptos
spring.cloud.gateway.server.webmvc.routes[5].id=conceptos
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://cursillo-ms-facturas
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/conceptos/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=1

# detalles facturas
spring.cloud.gateway.server.webmvc.routes[6].id=detalles-facturas
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://cursillo-ms-facturas
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/detalles-facturas/**
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=StripPrefix=1


# rutas de swagger
# inscripciones
spring.cloud.gateway.server.webmvc.routes[7].id=docs-inscripciones
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://cursillo-ms-inscripciones
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/docs/inscripciones/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=SetPath=/v3/api-docs

# notas
spring.cloud.gateway.server.webmvc.routes[8].id=docs-notas
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://cursillo-ms-notas
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/docs/notas/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[8].filters[0]=SetPath=/v3/api-docs

# facturas
spring.cloud.gateway.server.webmvc.routes[9].id=docs-facturas
spring.cloud.gateway.server.webmvc.routes[9].uri=lb://cursillo-ms-facturas
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/docs/facturas/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[9].filters[0]=SetPath=/v3/api-docs

# selector de servicios en swagger-ui
springdoc.swagger-ui.urls[0].name=Inscripciones
springdoc.swagger-ui.urls[0].url=/docs/inscripciones/v3/api-docs
springdoc.swagger-ui.urls[1].name=Notas
springdoc.swagger-ui.urls[1].url=/docs/notas/v3/api-docs
springdoc.swagger-ui.urls[2].name=Facturas
springdoc.swagger-ui.urls[2].url=/docs/facturas/v3/api-docs